version: '3.4'

services:
  db:
    image: postgres:16.3
    ports:
      - 5433:5432
    expose:
      - 5432
    environment:
      - POSTGRES_USER=prod
      - POSTGRES_PASSWORD=prod
      - POSTGRES_DB=sistema_escolar
    restart: always

  sistema-escolar:
    image: vitoroliveira2024/sistema-escolar:latest
    ports:
      - 8080:8080
    expose:
      - 8080
    environment:
      - DB_URL=jdbc:postgresql://db:5432/sistema_escolar
      - DB_USER=prod
      - DB_PASSWORD=prod
    depends_on:
      - db
    restart: always
