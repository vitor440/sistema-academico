name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
	  
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          

      - name: java-setup
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: '21'
          cache: maven
		
      - name: java-build
        working-directory: ./server
        run: mvn clean package -DskipTests

      - name: build-with-docker-compose
        working-directory: ./
        run: docker compose build

      - name: push-image-to-docker-hub
        run: |
          docker tag sistema_academico ${{ secrets.DOCKER_USERNAME }}/sistema_academico
          docker tag sistema_academico_react ${{ secrets.DOCKER_USERNAME }}/sistema_academico_react
          docker push ${{ secrets.DOCKER_USERNAME }}/sistema_academico
          docker push ${{ secrets.DOCKER_USERNAME }}/sistema_academico_react
